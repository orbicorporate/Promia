<div style="width:1080px;font-family:Arial,Helvetica,sans-serif;background:%%COR_SECUNDARIA%%;box-sizing:border-box;padding:0;">
  <div style="background:%%COR_PRIMARIA%%;padding:28px 36px;display:flex;align-items:center;justify-content:space-between;">
    <div style="display:flex;align-items:center;gap:14px;">
      <img src="%%LOGO_URL%%" alt="" style="width:56px;height:56px;object-fit:contain;border-radius:8px;background:#ffffff;padding:4px;" />
      <div style="color:#ffffff;font-size:24px;font-weight:800;">%%NOME_MERCADO%%</div>
    </div>
    <div style="color:#ffffff;font-size:14px;opacity:0.9;">%%VIGENCIA%%</div>
  </div>

  <div style="padding:20px 36px 6px;">
    <div style="color:#ffffff;font-size:40px;font-weight:900;text-transform:uppercase;letter-spacing:1px;">
      %%NOME_TABLOIDE%%
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(3, 1fr);gap:16px;padding:20px 36px 36px;">
    <!--PRODUTOS_INICIO-->
    <div style="background:#ffffff;border-radius:14px;padding:16px;text-align:center;">
      <div style="width:100%;height:110px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;">
        <img src="%%PRODUTO_IMAGEM_URL%%" alt="" style="max-width:100%;max-height:110px;object-fit:contain;" />
      </div>
      <div style="font-size:14px;color:#111827;font-weight:700;min-height:36px;">%%PRODUTO_NOME%%</div>
      <div style="display:inline-block;background:%%COR_PRIMARIA%%;color:#ffffff;font-size:24px;font-weight:900;padding:6px 14px;border-radius:8px;margin-top:8px;">
        %%PRODUTO_PRECO%%
      </div>
    </div>
    <!--PRODUTOS_FIM-->
  </div>
</div>
