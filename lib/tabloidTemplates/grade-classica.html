<div style="width:1080px;font-family:Arial,Helvetica,sans-serif;background:#ffffff;border:4px solid %%COR_PRIMARIA%%;box-sizing:border-box;padding:32px;">
  <div style="display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid %%COR_PRIMARIA%%;padding-bottom:20px;margin-bottom:24px;">
    <div style="display:flex;align-items:center;gap:16px;">
      <img src="%%LOGO_URL%%" alt="" style="width:64px;height:64px;object-fit:contain;border-radius:8px;" />
      <div>
        <div style="font-size:28px;font-weight:800;color:%%COR_SECUNDARIA%%;">%%NOME_MERCADO%%</div>
        <div style="font-size:14px;color:#6b7280;">%%VIGENCIA%%</div>
      </div>
    </div>
    <div style="background:%%COR_PRIMARIA%%;color:#ffffff;font-size:20px;font-weight:800;padding:10px 20px;border-radius:999px;text-transform:uppercase;">
      %%NOME_TABLOIDE%%
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(4, 1fr);gap:18px;">
    <!--PRODUTOS_INICIO-->
    <div style="border:1px solid #e5e7eb;border-radius:12px;padding:14px;text-align:center;background:#fafafa;">
      <div style="width:100%;height:120px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;">
        <img src="%%PRODUTO_IMAGEM_URL%%" alt="" style="max-width:100%;max-height:120px;object-fit:contain;" />
      </div>
      <div style="font-size:13px;color:#374151;font-weight:600;min-height:34px;">%%PRODUTO_NOME%%</div>
      <div style="font-size:22px;font-weight:800;color:%%COR_PRIMARIA%%;margin-top:6px;">%%PRODUTO_PRECO%%</div>
    </div>
    <!--PRODUTOS_FIM-->
  </div>
</div>
